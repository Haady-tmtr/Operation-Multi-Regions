plugin: amazon.aws.aws_ec2
regions:
  - eu-west-3
  - eu-west-1

hostnames:
  - instance-id

keyed_groups:
  - key: tags.Role
    prefix: role
  - key: tags.Environment
    prefix: env
  - key: placement.region
    prefix: region

compose:
  ansible_connection: '"community.aws.aws_ssm"'
  ansible_aws_ssm_region: placement.region
  ansible_aws_ssm_bucket_name: '"edunova-ansible-ssm-680319777993"'